[package]
name = "ghostwalk"
version = "0.3.0"
edition = "2024"

[lib]
name = "ghostwalk"
crate-type = ["rlib"]  # the phone build adds "cdylib" itself

[[bin]]
name = "ghostwalk"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
winit = "0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = "1.1.10"
earcutr = "0.5.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "links", "system_fonts", "wayland", "x11", "web_screen_reader"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21"

[profile.release]
opt-level = 3
strip = true
